<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Issue — Campus Fix</title>
    <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/report.css">
</head>
<body>
  <header class="navbar">
    <div class="brand">🏛️ Campus Fix</div>
    <nav>
      <span id="userInfo"></span>
      <a href="#" id="logoutBtn" class="btn-logout">Logout</a>
    </nav>
  </header>

  <main class="container">
    <div class="card narrow">
      <h2>Report an Issue</h2>
      <form id="reportForm">
        <label>Title</label>
        <input name="title" placeholder="Broken fan in Room 12" required>

        <label>Description</label>
        <textarea name="description" rows="4" placeholder="Describe the problem" required></textarea>

        <label>Category</label>
        <select name="category" required>
          <option>Electrical</option>
          <option>Plumbing</option>
          <option>Cleaning</option>
          <option>Furniture</option>
          <option>IT / Network</option>
          <option>Other</option>
        </select>

        <label>Location</label>
        <input name="location" placeholder="Block A, Room 203" required>

        <label>Priority</label>
        <select name="priority">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>

        <button type="submit" class="btn btn-primary">Submit Issue</button>
      </form>
    </div>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
  <script src="../js/report.js"></script>
</body>
</html>
