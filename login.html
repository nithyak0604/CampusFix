<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Campus Fix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card narrow">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Email</label>
      <input name="email" type="email" placeholder="you@campus.edu" required>

      <label>Password</label>
      <input name="password" type="password" placeholder="••••••" required>

      <button type="submit" class="btn btn-primary">Login</button>
    </form>
     </form>
  <p class="muted" style="margin-top:8px;">
    <a href="forgot-password.html">Forgot password?</a>
  </p>
  <p class="muted">New here? <a href="register.html">Create an account</a></p>
    <p class="hint">Demo: <code>ravi@campus.edu</code> / <code>student123</code></p>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
