<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Campus Fix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card narrow">
    <h2>Reset Password</h2>
    <p class="muted">Enter your registered email and choose a new password.</p>

    <form id="forgotForm">
      <label>Email</label>
      <input name="email" type="email" placeholder="you@campus.edu" required>

      <label>New Password</label>
      <input name="password" type="password" minlength="6" required>

      <label>Confirm New Password</label>
      <input name="confirm" type="password" minlength="6" required>

      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>

    <p class="muted" style="margin-top:12px;">
      <a href="login.html">← Back to Login</a>
    </p>
  </div>

  <script src="js/storage.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim().toLowerCase();
      const password = e.target.password.value;
      const confirm = e.target.confirm.value;

      if (password !== confirm) {
        alert("Passwords don't match.");
        return;
      }
      if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      const users = DB.getUsers();
      const user = users.find(u => u.email === email);

      if (!user) {
        alert("No account found with that email.");
        return;
      }

      user.password = password;
      DB.saveUsers(users);

      alert("Password reset! Please log in.");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
